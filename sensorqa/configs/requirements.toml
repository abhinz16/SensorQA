# ================================================================
# ALLAN-DEVIATION EXAMPLES
# ================================================================
#
# These are disabled by default because Allan coefficients should
# only be qualified when:
#
#   1. the test duration is appropriate,
#   2. SensorQA actually identifies the required Allan region,
#   3. the product has a documented stochastic-noise requirement.
#
# If an Allan coefficient is not produced, an enabled requirement
# would correctly become NOT_EVALUATED.
# ================================================================


[[requirements]]

id = "gx_angle_random_walk"

enabled = false

tool_id = "imu_allan_deviation"

metric = "GX Angle Random Walk Coefficient"

operator = "<="

limit = 0.001

unit = "rad/sqrt(s)"

description = """
Example only. X-axis angle random walk coefficient shall not exceed
0.001 rad/sqrt(s).
"""


[[requirements]]

id = "gy_angle_random_walk"

enabled = false

tool_id = "imu_allan_deviation"

metric = "GY Angle Random Walk Coefficient"

operator = "<="

limit = 0.001

unit = "rad/sqrt(s)"

description = """
Example only. Y-axis angle random walk coefficient shall not exceed
0.001 rad/sqrt(s).
"""


[[requirements]]

id = "gz_angle_random_walk"

enabled = false

tool_id = "imu_allan_deviation"

metric = "GZ Angle Random Walk Coefficient"

operator = "<="

limit = 0.001

unit = "rad/sqrt(s)"

description = """
Example only. Z-axis angle random walk coefficient shall not exceed
0.001 rad/sqrt(s).
"""


# ================================================================
# TEMPERATURE-STABILITY EXAMPLES
# ================================================================
#
# Disabled because the appropriate temperature coefficient limit
# is application-specific.
# ================================================================


[[requirements]]

id = "gx_temperature_coefficient"

enabled = false

tool_id = "imu_temperature_stability"

metric = "GX Temperature Coefficient"

operator = "abs<="

limit = 0.0001

unit = "rad/s/degC"

description = """
Example only. Absolute GX linear temperature coefficient shall not
exceed 0.0001 rad/s/degC.
"""


# ================================================================
# AXIS-CORRELATION EXAMPLE
# ================================================================
#
# Disabled because a correlation coefficient should usually be
# treated as a diagnostic metric rather than an automatic product
# qualification requirement.
# ================================================================


[[requirements]]

id = "accelerometer_axis_correlation"

enabled = false

tool_id = "imu_axis_correlation"

metric = "Accelerometer Maximum Absolute Axis Correlation"

operator = "<="

limit = 0.70

description = """
Example diagnostic-style requirement. Maximum absolute
accelerometer axis correlation shall not exceed 0.70.
"""