# ================================================================
# GRAVITY CONSISTENCY
# ================================================================

[[requirements]]

id = "gravity_magnitude_mae"

enabled = true

tool_id = "imu_gravity_error"

metric = "Gravity Magnitude MAE"

operator = "<="

limit = 0.10

unit = "m/s^2"

description = """
Mean absolute static gravity-magnitude error shall not exceed
0.10 m/s^2.
"""


[[requirements]]

id = "gravity_magnitude_rmse"

enabled = true

tool_id = "imu_gravity_error"

metric = "Gravity Magnitude RMSE"

operator = "<="

limit = 0.15

unit = "m/s^2"

description = """
Static gravity-magnitude RMSE shall not exceed 0.15 m/s^2.
"""


[[requirements]]

id = "gravity_max_error"

enabled = true

tool_id = "imu_gravity_error"

metric = "Maximum Absolute Gravity Magnitude Error"

operator = "<="

limit = 0.30

unit = "m/s^2"

description = """
Maximum observed absolute static gravity-magnitude error shall
not exceed 0.30 m/s^2.
"""


# ================================================================
# SIX-POSITION ACCELEROMETER CALIBRATION
# ================================================================

[[requirements]]

id = "accelerometer_x_sensitivity_error"

enabled = true

tool_id = "imu_six_position_calibration"

metric = "AX Sensitivity Error Percent"

operator = "between"

lower_limit = -2.0

upper_limit = 2.0

unit = "%"

description = """
X-axis accelerometer sensitivity error shall remain between
-2 percent and +2 percent before correction.
"""


[[requirements]]

id = "accelerometer_y_sensitivity_error"

enabled = true

tool_id = "imu_six_position_calibration"

metric = "AY Sensitivity Error Percent"

operator = "between"

lower_limit = -2.0

upper_limit = 2.0

unit = "%"

description = """
Y-axis accelerometer sensitivity error shall remain between
-2 percent and +2 percent before correction.
"""


[[requirements]]

id = "accelerometer_z_sensitivity_error"

enabled = true

tool_id = "imu_six_position_calibration"

metric = "AZ Sensitivity Error Percent"

operator = "between"

lower_limit = -2.0

upper_limit = 2.0

unit = "%"

description = """
Z-axis accelerometer sensitivity error shall remain between
-2 percent and +2 percent before correction.
"""


[[requirements]]

id = "accelerometer_bias_x"

enabled = true

tool_id = "imu_six_position_calibration"

metric = "AX Bias"

operator = "abs<="

limit = 0.20

unit = "m/s^2"

description = """
Absolute X-axis accelerometer bias estimated from six-position
testing shall not exceed 0.20 m/s^2.
"""


[[requirements]]

id = "accelerometer_bias_y"

enabled = true

tool_id = "imu_six_position_calibration"

metric = "AY Bias"

operator = "abs<="

limit = 0.20

unit = "m/s^2"

description = """
Absolute Y-axis accelerometer bias estimated from six-position
testing shall not exceed 0.20 m/s^2.
"""


[[requirements]]

id = "accelerometer_bias_z"

enabled = true

tool_id = "imu_six_position_calibration"

metric = "AZ Bias"

operator = "abs<="

limit = 0.20

unit = "m/s^2"

description = """
Absolute Z-axis accelerometer bias estimated from six-position
testing shall not exceed 0.20 m/s^2.
"""


