# ================================================================
# SensorQA Engineering Requirements
# ================================================================
#
# This file defines qualification limits separately from analysis
# algorithms.
#
# Analysis tools calculate engineering metrics.
# This file defines whether those metrics satisfy a specific
# qualification profile.
#
# IMPORTANT:
# The numerical values below are EXAMPLE REQUIREMENTS intended to
# demonstrate SensorQA functionality. They are not universal sensor
# acceptance limits.
#
# SensorQA V1 uses strict unit matching in the requirements engine.
# Requirement units should therefore match the units produced by
# SensorQA analysis tools.
# ================================================================


[profile]
name = "Example IMU Qualification Profile"
version = "1.0.0"

description = """
Example qualification requirements for demonstrating SensorQA.
Replace these limits with requirements appropriate to the actual
sensor, application, test protocol, and product specification.
"""

sensor_type = "imu"

example_profile = true


# ================================================================
# SAMPLING INTEGRITY
# ================================================================

[[requirements]]

id = "sampling_rate_error"

enabled = true

tool_id = "imu_sampling_integrity"

metric = "Sampling Rate Error"

operator = "abs<="

limit = 2.0

unit = "%"

description = """
Absolute difference between measured and nominal sampling frequency
shall not exceed 2 percent.
"""


[[requirements]]

id = "capture_fraction"

enabled = true

tool_id = "imu_sampling_integrity"

metric = "Estimated Capture Fraction"

operator = ">="

limit = 99.0

unit = "%"

description = """
Estimated sample capture fraction shall be at least 99 percent.
"""


[[requirements]]

id = "duplicate_timestamps"

enabled = true

tool_id = "imu_sampling_integrity"

metric = "Duplicate Timestamp Count"

operator = "<="

limit = 0

description = """
No duplicate timestamp intervals are permitted.
"""


[[requirements]]

id = "backward_timestamps"

enabled = true

tool_id = "imu_sampling_integrity"

metric = "Backward Timestamp Count"

operator = "<="

limit = 0

description = """
Timestamp sequence shall not move backward in time.
"""


# ================================================================
# GYROSCOPE ZERO-RATE BIAS
# ================================================================

[[requirements]]

id = "gyro_bias_x"

enabled = true

tool_id = "imu_gyro_bias"

metric = "GX Bias"

operator = "abs<="

limit = 0.005

unit = "rad/s"

description = """
Absolute X-axis stationary gyroscope bias shall not exceed
0.005 rad/s.
"""


[[requirements]]

id = "gyro_bias_y"

enabled = true

tool_id = "imu_gyro_bias"

metric = "GY Bias"

operator = "abs<="

limit = 0.005

unit = "rad/s"

description = """
Absolute Y-axis stationary gyroscope bias shall not exceed
0.005 rad/s.
"""


[[requirements]]

id = "gyro_bias_z"

enabled = true

tool_id = "imu_gyro_bias"

metric = "GZ Bias"

operator = "abs<="

limit = 0.005

unit = "rad/s"

description = """
Absolute Z-axis stationary gyroscope bias shall not exceed
0.005 rad/s.
"""


[[requirements]]

id = "gyro_bias_vector"

enabled = true

tool_id = "imu_gyro_bias"

metric = "Gyroscope Bias Vector Magnitude"

operator = "<="

limit = 0.008

unit = "rad/s"

description = """
Magnitude of the three-axis stationary gyroscope bias vector
shall not exceed 0.008 rad/s.
"""


